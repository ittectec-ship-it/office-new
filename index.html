<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JP AI — Office Assistant</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root { --copilot-grad: linear-gradient(135deg, #0078d4 0%, #7c3aed 45%, #ec4899 78%, #f59e0b 100%); --word-blue:#185abd; --border:#e2e8f0; --text-main:#0f172a; --text-muted:#64748b; }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { margin:0; background:#fff; color:var(--text-main); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  .header { background: linear-gradient(90deg, #0078d4, #7c3aed, #ec4899, #f59e0b); padding:12px 14px; display:flex; align-items:center; justify-content:space-between; color:#fff; }
  .menu-btn{ background:rgba(255,255,255,0.2); border:0; color:#fff; padding:8px 12px; border-radius:10px; font-size:18px; cursor:pointer; }
  .brand{ font-weight:800; font-size:22px; display:flex; align-items:center; gap:8px; }
  .word-badge{ background:#f1f5f9; margin:10px; padding:10px; border-radius:12px; text-align:center; color:var(--word-blue); font-weight:700; border:1px solid var(--border); }
  .keys-card{ margin:10px; padding:16px; border-radius:18px; border:1px solid #cbd5e1; box-shadow:0 4px 14px rgba(0,0,0,0.06); }
  .keys-card b{ font-size:18px; }
  .keys-card small{ color:var(--text-muted); }
  .keys-card input{ width:100%; margin:12px 0; padding:14px; border-radius:12px; border:1px solid var(--border); background:#f8fafc; font-size:14px; }
  .btn-save{ width:100%; padding:14px; border-radius:12px; border:0; background: linear-gradient(90deg, #0078d4, #7c3aed, #ec4899, #f59e0b); color:#fff; font-weight:800; font-size:16px; cursor:pointer; }
  .btn-save:active{ transform:scale(0.98); }
  .quick{ display:flex; gap:8px; padding:10px; }
  .quick button{ background:#fff; border:1px solid var(--border); padding:8px 14px; border-radius:20px; font-weight:600; cursor:pointer; }
  #chat{ flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:10px; }
  .msg{ padding:12px; border-radius:14px; font-size:14px; line-height:1.5; max-width:92%; border:1px solid var(--border); }
  .msg.user{ background:#185abd; color:#fff; margin-left:auto; }
  .msg.ai{ background:#f8fafc; }
  .bottom{ border-top:1px solid var(--border); padding:10px; display:flex; gap:8px; }
  .bottom input{ flex:1; padding:12px; border-radius:10px; border:1px solid var(--border); }
  .bottom button{ padding:12px 16px; border-radius:10px; border:0; background:#185abd; color:#fff; font-weight:700; cursor:pointer; }
  #status{ margin:0 10px 8px; padding:8px; border-radius:8px; display:none; text-align:center; font-size:13px; }
</style>
</head>
<body>

<div class="header">
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <div class="brand">✦ JP AI</div>
  <button class="menu-btn" onclick="openArena()">📤</button>
</div>

<div class="word-badge">📘 Microsoft Word</div>

<div class="keys-card" id="keyCard">
  <b>Connect AI Key</b><br>
  <small>Stored locally in your Office add-in cache.</small>
  <input type="password" id="apiKeyInput" placeholder="sk-xxxxxxxxxxxxxxxx">
  <button class="btn-save" onclick="saveKey()">Save Key & Start</button>
</div>

<div class="quick">
  <button onclick="quickAction('Summarize this document in 5 bullet points')">✨ Summarize</button>
  <button onclick="quickAction('Rewrite this to be more professional')">✍️ Rewrite</button>
  <button onclick="openArena()">Open Arena →</button>
</div>

<div id="chat"></div>
<div id="status"></div>

<div class="bottom">
  <input id="userInput" placeholder="Ask JP AI..." onkeydown="if(event.key==='Enter') sendMessage()">
  <button onclick="sendMessage()">Send</button>
</div>

<script>
let apiKey = localStorage.getItem('jp_api_key') || "";

Office.onReady(() => {
  if(apiKey){
    document.getElementById('apiKeyInput').value = apiKey;
    document.getElementById('keyCard').style.display='none';
    showStatus("Key loaded! Ready.","success");
  }
});

function saveKey(){
  const val = document.getElementById('apiKeyInput').value.trim();
  if(!val || val.length < 10){ showStatus("Paste a valid key first!","error"); return; }
  localStorage.setItem('jp_api_key', val);
  apiKey = val;
  document.getElementById('keyCard').style.display='none';
  showStatus("Key saved! You can now use JP AI.","success");
}

function showStatus(msg, type){
  const el=document.getElementById('status');
  el.textContent=msg; el.style.display='block';
  el.style.background = type==='error' ? '#fee2e2' : '#dcfce7';
  el.style.color = type==='error' ? '#991b1b' : '#166534';
  setTimeout(()=> el.style.display='none', 3000);
}

function addMsg(text, isUser){
  const c=document.getElementById('chat');
  const d=document.createElement('div');
  d.className = isUser ? 'msg user' : 'msg ai';
  d.textContent = text;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}

function sendMessage(){
  const input=document.getElementById('userInput');
  const txt=input.value.trim(); if(!txt) return;
  if(!apiKey){ showStatus("Save your AI Key first!","error"); document.getElementById('keyCard').style.display='block'; return; }
  addMsg(txt, true); input.value='';
  setTimeout(()=> addMsg("JP AI: Got it — '"+txt+"' — (connect your AI backend here)", false), 500);
}

function quickAction(prompt){
  document.getElementById('userInput').value = prompt;
  sendMessage();
}

function openArena(){
  const url="https://arena.ai/agent";
  if(window.Office && Office.context && Office.context.ui && Office.context.ui.openBrowserWindow){
    Office.context.ui.openBrowserWindow(url);
  }else{
    window.open(url, "_blank");
  }
}

function toggleMenu(){
  document.getElementById('keyCard').style.display = 
    document.getElementById('keyCard').style.display==='none' ? 'block' : 'none';
}
</script>
</body>
</html>
