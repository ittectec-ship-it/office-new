<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JP PILOT — Word, Excel & PowerPoint</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f5f7fb;
    --border: #e2e8f0;
    --text: #111827;
    --muted: #64748b;
    --copilot-grad: linear-gradient(135deg, #2563eb 0%, #06b6d4 35%, #8b5cf6 70%, #ec4899 100%);
    --copilot-soft: linear-gradient(135deg, rgba(37,99,235,0.08), rgba(139,92,246,0.08), rgba(236,72,153,0.08));
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Copilot Gradient Top Bar */
  .top {
    background: var(--bg);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    position: relative;
  }
  .top::after {
    content: "";
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: var(--copilot-grad);
  }
  .top button {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 11px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
  }
  .brand {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-badge {
    width: 28px;
    height: 28px;
    border-radius: 9px;
    background: var(--copilot-grad);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    box-shadow: 0 2px 8px rgba(99, 102, 241, 0.28);
  }
  .brand-title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.4px;
    background: var(--copilot-grad);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand-sub {
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.3px;
    margin-top: 1px;
  }
  .top span.spacer { width: 38px; }

  /* Sidebar */
  .sidebar {
    position: fixed;
    top: 0;
    left: -300px;
    width: 280px;
    height: 100%;
    background: #ffffff;
    z-index: 99;
    transition: 0.25s;
    padding: 14px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    box-shadow: 4px 0 20px rgba(0,0,0,0.06);
  }
  .sidebar.open { left: 0; }
  .sidebar-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0 14px 0;
  }
  .sidebar-head h2 {
    margin: 0;
    font-size: 20px;
    background: var(--copilot-grad);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sidebar .search { display: flex; gap: 6px; margin-bottom: 10px; }
  .sidebar .search input {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }
  .sidebar .search button {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 9px 11px;
    border-radius: 10px;
    cursor: pointer;
  }
  .newchat {
    background: var(--copilot-grad);
    border: 0;
    color: #fff;
    padding: 12px;
    border-radius: 24px;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(37, 99, 235, 0.22);
  }
  .list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .chatItem {
    background: transparent;
    border: 0;
    color: var(--text);
    text-align: left;
    padding: 11px 10px;
    border-radius: 10px;
    font-size: 13.5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }
  .chatItem:hover { background: var(--surface); }
  .chatItem.active {
    background: var(--copilot-soft);
    font-weight: 600;
    border: 1px solid rgba(99, 102, 241, 0.25);
  }
  .chatItem span { overflow: hidden; text-overflow: ellipsis; flex: 1; white-space: nowrap; }
  .chatItem i { color: var(--muted); font-style: normal; padding-left: 8px; }
  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.35);
    display: none;
    z-index: 90;
  }
  .overlay.show { display: block; }

  /* API Key Card */
  .keys {
    background: var(--surface);
    margin: 10px;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .keys.hidden { display: none; }
  .keys input {
    width: 100%;
    padding: 11px;
    margin: 8px 0;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
  }
  .keys button {
    background: var(--copilot-grad);
    border: 0;
    padding: 11px 16px;
    border-radius: 20px;
    font-weight: 700;
    color: #fff;
    font-size: 14px;
    width: 100%;
    cursor: pointer;
  }
  .keys small { color: var(--muted); }

  /* Chat Area */
  .hint {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    padding: 5px 10px 2px;
    margin: 0;
    flex-shrink: 0;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #ffffff;
  }
  .msg {
    max-width: 92%;
    padding: 12px 14px;
    border-radius: 16px;
    background: var(--surface);
    color: var(--text);
    white-space: pre-wrap;
    border: 1px solid var(--border);
    line-height: 1.45;
    word-wrap: break-word;
    font-size: 14px;
  }
  .msg.user {
    background: var(--copilot-grad);
    color: #ffffff;
    margin-left: auto;
    border: 0;
    box-shadow: 0 2px 10px rgba(37, 99, 235, 0.18);
  }
  .msg-head {
    display: flex;
    align-items: center;
    gap: 5px;
    opacity: 0.75;
    margin-bottom: 4px;
    font-size: 11px;
    font-weight: 700;
  }
  .msg img { width: 100%; border-radius: 12px; margin-top: 8px; display: block; border: 1px solid var(--border); }

  /* Message Action Buttons */
  .msg .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .insertBtn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--copilot-grad);
    color: #ffffff;
    padding: 7px 13px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 12px;
    border: 0;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(99, 102, 241, 0.25);
  }
  .copyBtn, .dl {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #ffffff;
    color: #2563eb;
    border: 1px solid #cbd5e1;
    padding: 6px 12px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 12px;
    text-decoration: none;
    cursor: pointer;
  }
  .dateSep { text-align: center; font-size: 11px; color: var(--muted); margin: 6px 0; }

  /* Quick Action Ribbon */
  .quickBar {
    display: flex;
    gap: 6px;
    padding: 8px 10px 4px;
    background: #ffffff;
    border-top: 1px solid var(--border);
    overflow-x: auto;
    flex-shrink: 0;
  }
  .chipBtn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 7px 11px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: 0.15s;
  }
  .chipBtn:hover {
    border-color: #6366f1;
    background: var(--copilot-soft);
  }
  .chipBtn.active {
    background: var(--copilot-grad);
    color: #ffffff;
    border-color: transparent;
  }

  /* Input Bar */
  .input {
    display: flex;
    gap: 8px;
    padding: 8px 10px 10px;
    background: #ffffff;
    flex-shrink: 0;
  }
  .input input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 24px;
    border: 1px solid #cbd5e1;
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .input input:focus {
    border-color: #6366f1;
    background: #ffffff;
  }
  .sendBtn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--copilot-grad);
    border: 0;
    padding: 12px 18px;
    border-radius: 24px;
    font-weight: 700;
    color: #ffffff;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
  }
  .sendBtn:disabled { opacity: 0.55; cursor: not-allowed; }
  .empty { text-align: center; color: var(--muted); padding: 30px 20px; font-size: 14px; }

  /* Toast notification */
  .toast {
    position: fixed;
    bottom: 78px;
    left: 50%;
    transform: translateX(-50%);
    background: #111827;
    color: #fff;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: 0.25s;
    z-index: 150;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="overlay" class="overlay"></div>
<div id="toast" class="toast">✓ Ready! Press Ctrl+V to paste</div>

<!-- Sliding Sidebar -->
<div id="sidebar" class="sidebar">
  <div class="sidebar-head">
    <div class="brand-badge">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
    </div>
    <h2>JP PILOT</h2>
  </div>
  <div class="search">
    <input id="searchBox" placeholder="Search flights & chats...">
    <button type="button" id="searchBtn">🔍</button>
  </div>
  <button type="button" class="newchat" id="newChatBtn">✈️ New Flight Chat</button>
  <div style="font-size:12px;color:#64748b;padding:6px 2px">Recent Chats - Last 5 Days</div>
  <div id="chatList" class="list"></div>
