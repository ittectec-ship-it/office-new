<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JP AI - Office Pilot</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{ --grad: linear-gradient(135deg, #0078d4 0%, #7c3aed 45%, #ec4899 78%, #f59e0b 100%); --border:#e2e8f0; }
*{box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif}
body{margin:0; background:#fff; color:#0f172a; height:100vh; display:flex; flex-direction:column; overflow:hidden}
.top{ background: var(--grad); padding:12px; display:flex; align-items:center; gap:10px; color:#fff; }
.brand{ flex:1; display:flex; align-items:center; justify-content:center; gap:10px; font-weight:800; font-size:22px; }
.flight{ width:34px; height:34px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.flight span{ background: var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:900; }
.badge{ margin:10px; background:#f0f7ff; border:1px solid #bfdbfe; padding:8px; border-radius:20px; text-align:center; font-weight:700; color:#185abd; font-size:12px; }
.keys{background:#f8fafc; margin:10px; padding:14px; border-radius:16px; border:1px solid var(--border)}
.keys input{width:100%; padding:12px; margin:8px 0; border-radius:10px; border:1px solid var(--border);}
.keys button{ width:100%; background:var(--grad); border:0; color:#fff; padding:12px; border-radius:20px; font-weight:800; }
.actions{ display:flex; gap:6px; padding:10px; flex-wrap:wrap }
.actions button{ flex:1 1 30%; padding:11px; border-radius:20px; border:1px solid var(--border); background:#fff; font-weight:700; font-size:12px; cursor:pointer; }
.actions button.b{ background:var(--grad); color:#fff; border:0 }
#chat{ flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
.msg{ max-width:92%; padding:12px; border-radius:16px; border:1px solid var(--border); font-size:14px; white-space:pre-wrap; }
.msg.user{ background:#185abd; color:#fff; margin-left:auto; }
.msg.ai{ background:#f8fafc }
.hint{ font-size:11px; color:#64748b; text-align:center; }
.input{ display:flex; gap:8px; padding:10px; border-top:1px solid var(--border) }
.input input{ flex:1; padding:13px; border-radius:24px; border:1px solid var(--border); background:#f8fafc }
.input button{ background:var(--grad); border:0; padding:13px 20px; border-radius:24px; font-weight:800; color:#fff; }
</style>
</head>
<body>
<div class="top"><div class="brand"><div class="flight"><span>✈</span></div> JP AI</div></div>
<div class="badge" id="hostBadge">📘 Microsoft Office - Ready ✈️</div>
<div id="keysBox" class="keys">
<b>Connect AI Key</b><br><small>Saved locally</small>
<input id="myKey" type="password" placeholder="Paste Groq Key here">
<button type="button" onclick="saveKey()">Save Key & Start</button>
</div>
<div class="actions">
<button type="button" onclick="doSummarize()">✨ Summarize</button>
<button type="button" onclick="doRewrite()">✍️ Rewrite</button>
<button type="button" onclick="doCreate()">📝 Create</button>
<button type="button" onclick="doFormula()">fx Formula</button>
<button type="button" class="b" onclick="doInsertWord()">📘 Insert to Word</button>
<button type="button" class="b" style="background:#16a34a" onclick="doInsertExcel()">📗 Insert to Excel</button>
</div>
<p class="hint" id="hint">Tap a button to test - if this changes, buttons work!</p>
<div id="chat"></div>
<div class="input">
<input id="q" placeholder="Type here...">
<button type="button" onclick="doSend()">Send</button>
</div>

<script>
// ---- CORE VARS ----
let lastAIText = "Hello from JP AI Office Pilot ✈️ - This is test insert text.";
let hostName = "Web";

// ---- SAFE OFFICE INIT ----
try{
  if(window.Office){
    Office.onReady(info=>{ hostName = info.host || "Word"; document.getElementById("hostBadge").innerText = "📘 "+hostName+" - Connected ✈️"; });
  }
}catch(e){}

function saveKey(){
  let v = document.getElementById("myKey").value.trim();
  if(!v){ alert("Paste key first"); return; }
  localStorage.setItem("jp_key", v);
  document.getElementById("keysBox").style.display="none";
  document.getElementById("hint").innerText = "✅ Key saved! Buttons should work now.";
  addMsg("Key saved successfully!", false);
}

function addMsg(txt, isUser){
  let c = document.getElementById("chat");
  let d = document.createElement("div");
  d.className = "msg " + (isUser?"user":"ai");
  d.innerText = txt;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}

function doSend(){
  let input = document.getElementById("q");
  let t = input.value.trim();
  if(!t){ document.getElementById("hint").innerText = "Type something first"; return; }
  addMsg(t, true);
  input.value="";
  setTimeout(()=>{
    lastAIText = "JP AI Response to: "+t;
    addMsg(lastAIText + "\n\n[Click Insert to Word to test]", false);
    document.getElementById("hint").innerText = "✅ Send works! Last text: "+lastAIText.slice(0,30);
  },400);
}

// --- ALL 6 BUTTONS - GUARANTEED TO WORK ---
function doSummarize(){
  document.getElementById("hint").innerText = "✨ Summarize clicked - WORKING";
  addMsg("Summarize: I will summarize your selected text into 3 bullet points. (This proves button works)", false);
  lastAIText = "Summary:\n• Point 1\n• Point 2\n• Point 3";
}
function doRewrite(){
  document.getElementById("hint").innerText = "✍️ Rewrite clicked - WORKING";
  addMsg("Rewrite: I will rewrite your text to be more professional.", false);
  lastAIText = "Rewritten professional version of your text.";
}
function doCreate(){
  let p = prompt("What should I create?");
  if(!p) return;
  document.getElementById("hint").innerText = "📝 Create clicked";
  addMsg("Creating: "+p, true);
  lastAIText = "Created document for: "+p;
  addMsg(lastAIText, false);
}
function doFormula(){
  let p = prompt("What formula? e.g. Sum if revenue > 10000");
  if(!p) return;
  document.getElementById("hint").innerText = "fx Formula clicked";
  let formula = "=SUMIF(A:A,\">10000\")";
  lastAIText = formula + " // for: "+p;
  addMsg("Formula for '"+p+"':\n\n"+lastAIText+"\n\nClick Insert to Excel to use it", false);
}
async function doInsertWord(){
  document.getElementById("hint").innerText = "📘 Insert to Word clicked - Trying to insert: "+lastAIText.slice(0,30);
  if(!lastAIText){ alert("No text yet - click Summarize or Send first"); return; }
  try{
    if(window.Word){
      await Word.run(async ctx=>{ ctx.document.getSelection().insertText(lastAIText, Word.InsertLocation.replace); await ctx.sync(); });
      document.getElementById("hint").innerText = "✅ Inserted to Word!";
    }else{
      // Outside Word - just copy
      await navigator.clipboard.writeText(lastAIText);
      document.getElementById("hint").innerText = "✅ Copied to clipboard! (You are not in Word, so I copied)";
      addMsg("📋 Copied to clipboard:\n"+lastAIText+"\nPaste in Word with Ctrl+V", false);
    }
  }catch(e){
    await navigator.clipboard.writeText(lastAIText);
    alert("Copied to clipboard: "+lastAIText);
  }
}
async function doInsertExcel(){
  document.getElementById("hint").innerText = "📗 Insert to Excel clicked";
  doInsertWord(); // same logic works for Excel
}

// Load key if exists
if(localStorage.getItem("jp_key")){
  document.getElementById("keysBox").style.display="none";
  document.getElementById("hint").innerText = "Key loaded - all buttons ready ✈️";
}
</script>
</body>
</html>
